<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة ملاذ</title><link rel="stylesheet" href="/style.css"></head><body><main style="max-width:1100px;margin:30px auto;padding:20px"><div style="display:flex;justify-content:space-between;align-items:center"><div><span class="eyebrow">OWNER / ADMIN</span><h1>لوحة إدارة ملاذ</h1><p>التقديمات والتذاكر للإداريين. الرسائل الخاصة واللوقات السرية للمالك فقط.</p></div><a class="btn" href="/">الموقع</a></div><section class="admin-grid"><div class="admin-panel"><h2>التقديمات</h2><div id="applications">جاري التحميل...</div></div><div class="admin-panel"><h2>التذاكر</h2><div id="tickets">جاري التحميل...</div></div><div class="admin-panel"><h2>الإداريون</h2><input id="adminUser" placeholder="اسم مستخدم مسجل"><button class="btn" onclick="grant()">إضافة إداري</button><div id="admins"></div></div><div class="admin-panel"><h2>رد على تذكرة</h2><input id="ticketId" placeholder="معرف التذكرة"><textarea id="reply" placeholder="الرد"></textarea><button class="btn" onclick="sendReply()">إرسال</button></div><div class="admin-panel owner-only"><h2>رسائل الموقع الخاصة</h2><div id="privateMessages">للمالك فقط</div></div><div class="admin-panel owner-only"><h2>اللوقات الكاملة</h2><div id="logs">للمالك فقط</div></div></section></main><script src="/admin.js"></script></body></html>
