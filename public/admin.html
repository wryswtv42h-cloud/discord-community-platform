<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة إدارة ملاذ</title><link rel="stylesheet" href="/style.css"><style>.admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}.admin-panel{background:rgba(17,24,36,.92);border:1px solid var(--line);border-radius:18px;padding:20px}.admin-row{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:12px 0}.admin-row span{display:flex;flex-direction:column;min-width:0}.admin-row small{color:var(--muted);overflow-wrap:anywhere}.danger{border:0;border-radius:10px;padding:9px 13px;background:#5b2631;color:#fff;cursor:pointer}</style></head><body><main class="page" style="max-width:1200px"><header style="position:static;margin-bottom:24px"><div><b>MLD / ملاذ</b><div class="breadcrumb"><span>لوحة الإدارة</span><span>›</span><b id="panelRole">جاري التحقق</b></div></div><a class="btn" href="/">الموقع</a></header><div id="gate" class="emptyState">جاري التحقق من الصلاحيات...</div><section id="adminApp" class="admin-grid" hidden><div class="admin-panel"><h2>التقديمات</h2><div id="applications">جاري التحميل...</div></div><div class="admin-panel"><h2>التذاكر</h2><div id="tickets">جاري التحميل...</div></div><div class="admin-panel"><h2>رد على تذكرة</h2><input id="ticketId" placeholder="معرف التذكرة"><textarea id="reply" placeholder="الرد" style="width:100%;min-height:120px"></textarea><button class="btn" onclick="sendReply()">إرسال</button></div><div class="admin-panel" id="ownerPanel" hidden><h2>الإداريون</h2><input id="adminUser" placeholder="اسم مستخدم مسجل"><button class="btn" onclick="grant()">إضافة إداري</button><div id="admins"></div></div><div class="admin-panel" id="ownerMessages" hidden><h2>الرسائل الخاصة والمجهولة</h2><div id="privateMessages">جاري التحميل...</div><h3>مجهولة</h3><div id="anonymousMessages">جاري التحميل...</div></div><div class="admin-panel" id="ownerLogs" hidden><h2>اللوقات</h2><div id="logs">جاري التحميل...</div></div></section></main><script src="/admin.js"></script></body></html>
